name: Run S3 Operations Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install moto boto3 pytest

    - name: Run tests (with full logs)
      run: |
        echo "Running tests with verbose logging..."
        pytest -vv -s --log-cli-level=INFO